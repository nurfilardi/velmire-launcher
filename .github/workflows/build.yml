# Velmire Launcher CI — build APK on push, release on tag
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.3'
          cache: true

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main
          curl -fsSL -o assets/fonts/Barlow-Regular.ttf $base/ofl/barlow/Barlow-Regular.ttf
          curl -fsSL -o assets/fonts/Barlow-Medium.ttf $base/ofl/barlow/Barlow-Medium.ttf
          curl -fsSL -o assets/fonts/Barlow-SemiBold.ttf $base/ofl/barlow/Barlow-SemiBold.ttf
          curl -fsSL -o assets/fonts/BarlowCondensed-SemiBold.ttf $base/ofl/barlowcondensed/BarlowCondensed-SemiBold.ttf
          curl -fsSL -o assets/fonts/BarlowCondensed-Bold.ttf $base/ofl/barlowcondensed/BarlowCondensed-Bold.ttf

      - name: Ensure gradle wrapper
        run: |
          base=https://raw.githubusercontent.com/gradle/gradle/v8.12.0
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar $base/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f android/gradlew ]; then
            curl -fsSL -o android/gradlew $base/gradlew
            chmod +x android/gradlew
          fi
          if [ ! -f android/gradlew.bat ]; then
            curl -fsSL -o android/gradlew.bat $base/gradlew.bat
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Commit build log on failure
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            tail -c 100000 /tmp/build.log > build-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f build-failure.log
            git commit -m "ci: record build failure [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: velmire-launcher-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Remove old latest assets
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Publish latest APK release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: APK universal dari commit ${{ github.sha }}.
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
